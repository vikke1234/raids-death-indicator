name: Build with Gradle

on:
  push:
    branches:
      - master
    tags:
      - 'v*' # Triggers automatically when pushing a version tag (e.g. v1.0.0)
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Update target repo & create release?'
        type: boolean
        required: true
        default: true
      version_tag:
        description: 'Tag / Release Version (e.g., v1.0.0)'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: write

jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Fetch full history to generate commit range logs

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Build shadowJar
        run: ./gradlew shadowJar

      - name: Upload shadowJar
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: raids-death-indicator-shadow
          path: build/libs/*-all.jar

      # Checkout plugin-hub fork
      - name: Checkout Target Repository
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 'vikke1234/plugin-hub'
          token: ${{ secrets.RDI }}
          path: 'target-repo'
          # Full history keeps upstream/master available as a branch base.
          fetch-depth: 0

      # Create a fresh PR branch from upstream/master for this release
      - name: Create Plugin Hub Update Branch and PR
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.RDI }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          NEW_HASH="${{ github.sha }}"
          SOURCE_DIR="$(pwd)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
            if [ -n "${TAG_NAME}" ] && git rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}" >/dev/null; then
              NEW_HASH=$(git rev-parse "${TAG_NAME}^{commit}")
            fi
          fi

          if [ -z "${TAG_NAME}" ]; then
            echo "No release tag provided" >&2
            exit 1
          fi

          BRANCH="rdi/${TAG_NAME}"
          echo "Plugin hub branch: ${BRANCH}"
          echo "Plugin commit hash: ${NEW_HASH}"

          cd target-repo

          # Git Identity Configuration
          git config user.name "Viktor Horsmanheimo"
          git config user.email "viktor.horsmanheimo@gmail.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/runelite/plugin-hub.git
          else
            git remote add upstream https://github.com/runelite/plugin-hub.git
          fi
          git fetch upstream

          # Build the PR branch directly from upstream/master, without rewriting fork history.
          git checkout -B "${BRANCH}" upstream/master
          OLD_HASH=$(grep -E '^commit=' plugins/raids-death-indicator | cut -d'=' -f2 | tr -d '\r\n')
          echo "Previous plugin-hub commit hash: ${OLD_HASH}"

          cd "$SOURCE_DIR"
          if [ -n "$OLD_HASH" ] && git cat-file -e "$OLD_HASH^{commit}" 2>/dev/null; then
            COMMIT_TITLES=$(git log ${OLD_HASH}..${NEW_HASH} --oneline)
          else
            COMMIT_TITLES=$(git log -1 --format="%s")
          fi

          cd target-repo
          sed -i "s/^commit=.*/commit=${NEW_HASH}/" plugins/raids-death-indicator
          git add plugins/raids-death-indicator
          git commit -m "Update raids-death-indicator to ${NEW_HASH}" -m "${COMMIT_TITLES}" || exit 0

          # A rerun of the same tag must not rewrite the PR branch.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            git fetch origin "${BRANCH}"
            REMOTE_HASH=$(git show FETCH_HEAD:plugins/raids-death-indicator \
              | grep -E '^commit=' | cut -d'=' -f2 | tr -d '\r\n')
            if [ "${REMOTE_HASH}" != "${NEW_HASH}" ]; then
              echo "Branch ${BRANCH} already exists for a different plugin commit" >&2
              exit 1
            fi
            echo "Branch ${BRANCH} is already up to date"
          else
            git push -u origin "${BRANCH}"
          fi

          PR_TITLE="Update raids-death-indicator to ${NEW_HASH}"
          PR_NUMBER=$(gh pr list --repo runelite/plugin-hub --state open \
            --head "vikke1234:${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --repo runelite/plugin-hub \
              --title "${PR_TITLE}" --body "${COMMIT_TITLES}" || true
          else
            gh pr create --repo runelite/plugin-hub --base master \
              --head "vikke1234:${BRANCH}" \
              --title "${PR_TITLE}" --body "${COMMIT_TITLES}" || true
          fi

      # Publish jar
      - name: Create Release on Source Repo
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
          fi

          # Find previous tag to extract commit log between releases
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Write release notes safely to a temporary file to prevent YAML syntax issues
          echo "Automated release build for version ${TAG_NAME}" > release_notes.md
          echo "" >> release_notes.md
          echo "### What's Changed:" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "Generating release notes between ${PREV_TAG} and HEAD..."
            git log ${PREV_TAG}..HEAD --oneline >> release_notes.md
          else
            echo "No previous tag found. Using current commit message..."
            git log -1 --format="%s" >> release_notes.md
          fi

          # Create release directly on vikke1234/raids-death-indicator using the notes file
          gh release create "${TAG_NAME}" build/libs/*-all.jar \
            --title "Release ${TAG_NAME}" \
            --notes-file release_notes.md
